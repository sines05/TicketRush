services:
  db:
    image: postgres:15-alpine
    container_name: ticketrush-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ticketrush}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-ticketrush}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ticketrush-net

  redis:
    image: redis:7-alpine
    container_name: ticketrush-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - ticketrush-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ticketrush-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    networks:
      - ticketrush-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: ticketrush-frontend
    restart: always
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:8080
      VITE_PUBLIC_API_URL: ${VITE_PUBLIC_API_URL:-http://localhost:8080}
      VITE_USE_MOCK: "false"
    ports:
      - "5173:5173"
    networks:
      - ticketrush-net

volumes:
  postgres_data:
networks:
  ticketrush-net:
    driver: bridge
