<svg width="1440" height="260" viewBox="0 0 1440 260" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">TicketRush x SoundSip promotion banner</title>
  <desc id="desc">Promotional banner for a fictional drink combo offer on TicketRush.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1440" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06231F"/>
      <stop offset=".5" stop-color="#0F766E"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cup" x1="919" y1="50" x2="1158" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F0FDFA"/>
      <stop offset=".46" stop-color="#A7F3D0"/>
      <stop offset="1" stop-color="#14B8A6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1074 102) rotate(8) scale(446 192)">
      <stop stop-color="#A7F3D0" stop-opacity=".45"/>
      <stop offset="1" stop-color="#A7F3D0" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#001B16" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1440" height="260" rx="28" fill="url(#bg)"/>
  <rect width="1440" height="260" rx="28" fill="url(#glow)"/>
  <path d="M0 70C149 30 253 37 383 75C533 118 688 113 842 70C1015 22 1192 21 1440 66V0H0V70Z" fill="#ECFCCB" opacity=".11"/>
  <text x="78" y="78" fill="#F0FDFA" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">TicketRush</text>
  <text x="295" y="78" fill="#CCFBF1" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="850">x SoundSip</text>
  <text x="78" y="143" fill="#ECFDF5" font-size="46" font-weight="950">Combo nước mát cho đêm nhạc nóng</text>
  <text x="82" y="188" fill="#CFFAFE" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700">Nhận voucher đồ uống khi đặt vé concert chọn lọc trên TicketRush</text>
  <g filter="url(#shadow)">
    <rect x="865" y="62" width="280" height="128" rx="24" fill="#ECFDF5"/>
    <text x="935" y="112" fill="#064E3B" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="950">COMBO</text>
    <text x="925" y="175" fill="#064E3B" font-family="Inter, Arial, sans-serif" font-size="62" font-weight="950">1+1</text>
    <path d="M1094 65H1214L1196 210H1112L1094 65Z" fill="url(#cup)"/>
    <path d="M1086 62H1222" stroke="#F0FDFA" stroke-width="16" stroke-linecap="round"/>
    <path d="M1120 98H1188" stroke="#064E3B" stroke-width="8" stroke-linecap="round" opacity=".54"/>
    <path d="M1126 129H1182" stroke="#064E3B" stroke-width="8" stroke-linecap="round" opacity=".38"/>
    <path d="M1230 42L1190 96" stroke="#FDE68A" stroke-width="8" stroke-linecap="round"/>
    <circle cx="1248" cy="49" r="13" fill="#FDE68A"/>
  </g>
  <g opacity=".68">
    <path d="M682 134C694 120 706 120 718 134C730 148 742 148 754 134" stroke="#FDE68A" stroke-width="6" stroke-linecap="round"/>
    <path d="M1288 162C1300 148 1312 148 1324 162C1336 176 1348 176 1360 162" stroke="#CCFBF1" stroke-width="6" stroke-linecap="round"/>
    <circle cx="704" cy="66" r="4" fill="#FDE68A"/>
    <circle cx="1322" cy="84" r="4" fill="#CCFBF1"/>
  </g>
  
</svg>
